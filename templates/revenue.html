<script>
'use strict';
const META={membership:{title:'长视频平台会员收入',unit:'亿元',type:'bar'},advertising:{title:'长视频平台广告收入',unit:'亿元',type:'bar'},members:{title:'长视频平台会员数',unit:'亿',type:'line'},arppu:{title:'会员 ARPPU',unit:'元/月',type:'line'}};
const ORDER=['腾讯视频','爱奇艺','优酷视频','芒果TV'];
const COLORS=['#A9BACF','#C0D688','#89D8F0','#EDB795'];
const LINES=['#486b9f','#7ba900','#00aee8','#df661d'];

const $=id=>document.getElementById(id);
ORDER.forEach((p,i)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='checkbox';input.checked=true;input.value=p;input.onchange=render;label.append(input,document.createTextNode(p));$('platforms').append(label);});
const number=v=>typeof v==='number'&&Number.isFinite(v);
function yoy(a,b){return !number(a)||!number(b)||b===0?'无可比数据':`${(a/b-1)*100>0?'+':''}${((a/b-1)*100).toFixed(1)}%`;}
function validate(d){if(!d||typeof d.source!=='string')throw Error('数据必须包含 source 来源字符串。');for(const key of Object.keys(META)){if(!Array.isArray(d[key])||!d[key].length)throw Error(key+' 必须是非空数组。');const seen=new Set();for(const r of d[key]){if(!/^\d{2}Q[1-4]$/.test(r.period)||seen.has(r.period))throw Error('季度格式错误或重复：'+r.period);seen.add(r.period);for(const p of ORDER)if(r[p]!==null&&(!number(r[p])||r[p]<0))throw Error(r.period+' '+p+' 必须为非负数或 null。');}}}
function render(){try{
validate(data);const selected=Array.from($('platforms').querySelectorAll('input:checked')).map(x=>x.value);if(!selected.length)throw Error('请至少选择一个平台。');
const key=$('metric').value,m=META[key],all=[...data[key]].sort((a,b)=>a.period.localeCompare(b.period)),q=$('quarter').value;
const rows=all.filter(r=>q==='all'||r.period.endsWith(q)).slice(-12);if(!rows.length)throw Error('所选季度没有数据。');

const totals=rows.map(sum);const missing=rows.some(r=>selected.some(p=>!number(r[p])));

if(key==='members')footer.push('口径：腾讯、爱奇艺为日均；芒果、优酷为季末会员数。');

chart.clear();chart.setOption({animation:false,backgroundColor:'#fff',title:{text:m.title+'（'+m.unit+'）',left:24,top:18,textStyle:{fontSize:15,color:'#263038'}},grid:{left:62,right:218,top:100,bottom:125},tooltip:{trigger:'axis',valueFormatter:v=>v==null?'缺失':Number(v).toFixed(2)+' '+m.unit},xAxis:{type:'category',data:rows.map(r=>r.period),axisTick:{show:false},axisLabel:{interval:0,fontSize:11}},yAxis:{type:'value',name:m.unit,max:v=>v.max*1.25,splitLine:{lineStyle:{color:'#e5e8e4'}}},series:[...selected.map(p=>{const i=ORDER.indexOf(p);return {name:p,type:m.type,stack:m.type==='bar'?'total':undefined,connectNulls:false,data:rows.map(r=>r[p]),barMaxWidth:56,itemStyle:{color:(m.type==='bar'?COLORS:LINES)[i]},lineStyle:{width:2},label:{show:m.type==='bar'&&q!=='all',position:'inside',fontSize:10,formatter:o=>number(o.value)&&o.value>=5?o.value.toFixed(0):''}};}),...(m.type==='bar'?[{name:'所选平台合计',type:'bar',data:totals,barGap:'-100%',barMaxWidth:56,silent:true,itemStyle:{color:'transparent'},label:{show:true,position:'top',fontSize:11,fontWeight:'bold',formatter:o=>number(o.value)?o.value.toFixed(1):''}}]:[])],graphic:graphics.concat(footer.map((text,i)=>({type:'text',style:{x:24,y:455+i*20,text,fill:'#68746c',font:'10px sans-serif'}})))});
if(m.type==='bar'&&prev&&number(sum(prev))&&number(sum(latest))&&sum(prev)!==0){const pi=rows.findIndex(r=>r.period===prev.period);if(pi>=0){const a=chart.convertToPixel({xAxisIndex:0,yAxisIndex:0},[pi,sum(prev)]),b=chart.convertToPixel({xAxisIndex:0,yAxisIndex:0},[rows.length-1,sum(latest)]);const y=Math.min(a[1],b[1])-40,x=(a[0]+b[0])/2;chart.setOption({graphic:[...graphics,...footer.map((text,i)=>({type:'text',style:{x:24,y:455+i*20,text,fill:'#68746c',font:'10px sans-serif'}})),{type:'polyline',z:50,shape:{points:[[a[0],a[1]-22],[a[0],y],[b[0],y],[b[0],b[1]-22]]},style:{stroke:'#8c9790',lineWidth:1,fill:null}},{type:'polygon',z:51,shape:{points:[[b[0]-4,b[1]-28],[b[0]+4,b[1]-28],[b[0],b[1]-22]]},style:{fill:'#8c9790'}},{type:'rect',z:52,shape:{x:x-37,y:y-11,width:74,height:22,r:4},style:{fill:'#fff',stroke:'#d4dbd5'}},{type:'text',z:53,style:{x,y,text:yoy(sum(latest),sum(prev)),align:'center',verticalAlign:'middle',fill:'#ae3030',font:'11px sans-serif'}}]});}}
